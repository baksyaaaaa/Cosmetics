name: Mojang keys

# Render can't reach Mojang (its address is blocked), so GitHub fetches what the server needs from Mojang:
# the public keys Mojang signs player certificates with, and the SC Client team's player UUIDs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/mojang-keys.yml"]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          set -e
          curl -fsS https://api.minecraftservices.com/publickeys -o /tmp/keys.json
          jq '{playerCertificateKeys: [.playerCertificateKeys[].publicKey]}' /tmp/keys.json > mojang-keys.json
          echo '{}' > team.json
          for n in baksya wsammyyy; do
            id=$(curl -fsS "https://api.mojang.com/users/profiles/minecraft/$n" | jq -r .id)
            jq --arg n "$n" --arg id "$id" '. + {($n): $id}' team.json > /tmp/t && mv /tmp/t team.json
          done
          cat mojang-keys.json | head -c 200; echo; cat team.json
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mojang-keys.json team.json
          git diff --cached --quiet || (git commit -m "Update Mojang keys and team UUIDs" && git push)
